<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>Galerias</title>
</head>
<body>
  <header>
    <h1>Galerias - Igreja</h1>
    <p>
      Uma coleção visual sobre arquitetura, fé e momentos litúrgicos.
    </p>

  </header>
  <section class="Galerias">
    <div class="galeria" id="g1">
      <h2>
        Catedrais
      </h2>
      <div class="container-imgs">
        <ul class="imagens">
          <li><img src="img/catedriais/Catedral- alongado.jfif" alt=""></li>
          <li><img src="img/catedriais/Catedral- santasi.jfif" alt=""></li>
          <li><img src="img/catedriais/Catedral-Amarelo.jfif" alt=""></li>
          <li><img src="img/catedriais/Catedral-Branca.jfif" alt=""></li>
        </ul>

      </div>
    </div>

    <div class="galeria" id="g2">
      <h2>
        Capelinhas
      </h2>
      <div class="container-imgs">
        <ul class="imagens">
          <li><img src="img/capelinhas/Capela-amarela.jfif" alt=""></li>
          <li><img src="img/capelinhas/Capela-azul.jfif" alt=""></li>
          <li><img src="img/capelinhas/Capela-brancaeamarelo.jfif" alt=""></li>
          <li><img src="img/capelinhas/Capela-Brancaeazul.jfif" alt=""></li>
        </ul>
      </div>
    </div>

    <div class="galeria" id="g3">
      <h2>
        Missas
      </h2>
      <div class="container-imgs">
        <ul class="imagens">
          <li><img src="img/missas/missa-pessas-cima.jfif" alt=""></li>
          <li><img src="img/missas/missa-cima.jfif" alt=""></li>
          <li><img src="img/missas/missa-coroinhas.jfif" alt=""></li>
          <li><img src="img/missas/missa-vinho.jfif" alt=""></li>
        </ul>

      </div>
    </div>
      
    <footer>
      <p>Feito por Natan Costa e Pietro Dopp | Direitos reservados.</p>
    </footer>



  </section>
  <script src="./script.js"></script>
</body>
</html>
